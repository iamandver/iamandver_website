<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>iamandver.com/2048</title>
    <link rel="stylesheet" href="/src/css/common.css"/>
    <link rel="stylesheet" href="/src/css/game.css"/>
    <link rel="stylesheet" href="/src/css/2048.css"/>
</head>

<body>

<div class="page game-page">
    <main class="game-layout">

        <nav class="page-navigation">
            <a class="navigation-link" href="./">[..] Home</a>
        </nav>

        <div class="game-container">

            <section class="game">
                <div class="game-toolbar">
                    <h1 class="page-title">2048</h1>
                    <button id="new-game" type="button">New game</button>
                </div>

                <div class="game-scores">
                    <span>Score <output id="game-score">0</output></span>
                    <span>Last <output id="last-score">—</output></span>
                    <span>Best <output id="best-score">0</output></span>
                </div>

                <div class="game-board-area">
                    <div class="game-board">
                        <div id="cell-0-0" class="game-cell"></div>
                        <div id="cell-0-1" class="game-cell"></div>
                        <div id="cell-0-2" class="game-cell"></div>
                        <div id="cell-0-3" class="game-cell"></div>
                        <div id="cell-1-0" class="game-cell"></div>
                        <div id="cell-1-1" class="game-cell"></div>
                        <div id="cell-1-2" class="game-cell"></div>
                        <div id="cell-1-3" class="game-cell"></div>
                        <div id="cell-2-0" class="game-cell"></div>
                        <div id="cell-2-1" class="game-cell"></div>
                        <div id="cell-2-2" class="game-cell"></div>
                        <div id="cell-2-3" class="game-cell"></div>
                        <div id="cell-3-0" class="game-cell"></div>
                        <div id="cell-3-1" class="game-cell"></div>
                        <div id="cell-3-2" class="game-cell"></div>
                        <div id="cell-3-3" class="game-cell"></div>
                    </div>

                    <div id="game-status" class="game-status" data-state="playing" hidden>
                        <p id="game-message" class="game-message"></p>
                        <p id="game-final-score" class="game-final-score" hidden></p>
                        <p id="game-new-record" class="game-record" hidden>New personal best!</p>
                    </div>
                </div>

                <p id="game-instructions" class="game-instructions">Swipe or use arrow keys.</p>
            </section>

        </div>

    </main>

    <footer class="copyright">Copyright © 2026 iamandver</footer>
</div>

<script type="module" src="/src/ts/games/2048.ts"></script>

</body>

</html>
